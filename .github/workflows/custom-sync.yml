# Fork-only (yruh/vm2api): follow upstream releases with the custom patches.
# Every 30 min: when dofastted/vm2api has a release this fork has not built,
# rebase `custom` onto it, test, publish ghcr.io/<owner>/vm2api:<tag> (amd64),
# push the branch and tag, then create the release the server watches.
# A conflict or regression opens an issue and publishes nothing.
#
# Needs the SYNC_TOKEN secret (a token with repo + workflow scope): pushes
# made with GITHUB_TOKEN cannot carry upstream workflow-file changes.
name: custom-sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: rebuild even if the release exists or is still fresh
        type: boolean
        default: false

concurrency:
  group: custom-sync
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write

env:
  UPSTREAM: dofastted/vm2api
  # The checkout gains an `upstream` remote; without this gh would target it.
  GH_REPO: ${{ github.repository }}
  MIN_AGE_MINUTES: '120'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: rebase and test
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: bash scripts/custom/sync.sh
      - name: push branch and tag
        if: steps.sync.outputs.build == 'true'
        env:
          TAG: ${{ steps.sync.outputs.tag }}
        run: |
          git push --force origin HEAD:refs/heads/custom
          git tag -f "$TAG"
          git push --force origin "refs/tags/${TAG}"
      - uses: docker/setup-buildx-action@v3
        if: steps.sync.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.sync.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        id: meta
        if: steps.sync.outputs.build == 'true'
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vm2api" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.sync.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.sync.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.sync.outputs.tag }}-amd64
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=custom
          cache-to: type=gha,scope=custom,mode=max
      - name: release
        if: steps.sync.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          notes="upstream ${UPSTREAM}@${TAG} + custom patches ($(git rev-parse --short HEAD)). Image: ${IMAGE}:${TAG} (amd64)."
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --title "vm2api ${TAG} (custom)" --notes "$notes" --latest --verify-tag
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          REASON: ${{ steps.sync.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="custom-sync failed for ${TAG:-latest upstream}"
          body="${REASON:-build or publish step failed}

          Run: ${RUN_URL}
          The server keeps running the last good release until this is fixed."
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
